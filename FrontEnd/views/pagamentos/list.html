<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AGAPE — Formas de Pagamento</title>
  <link rel="stylesheet" href="../../assets/css/bootstrap.css">
  <link rel="stylesheet" href="../../assets/css/theme.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>

<body>
  <div class="app-layout">
    <div id="sidebar-root"></div>

    <div class="main-content" id="main-content">

      <header class="topbar" role="banner">
        <div class="d-flex align-items-center gap-2">
          <button class="btn btn-link p-0 d-lg-none" id="mobile-menu-toggle"
            aria-label="Abrir menu" aria-expanded="false" aria-controls="sidebar">
            <i class="bi bi-list fs-4" style="color:var(--color-text);"></i>
          </button>
          <div>
            <div class="page-title">Formas de Pagamento</div>
            <div class="page-breadcrumb">Início / Cadastros / Formas de Pagamento</div>
          </div>
        </div>
        <div class="d-flex align-items-center gap-2">
          <button class="btn btn-sm btn-outline-secondary" id="btn-logout">
            <i class="bi bi-box-arrow-right me-1"></i> Sair
          </button>
        </div>
      </header>

      <main class="page-content" role="main">

        <!-- Filtros -->
        <div class="card mb-3">
          <div class="card-body py-3">
            <div class="row g-2 align-items-end">
              <div class="col-sm-4">
                <label class="form-label mb-1" for="filtro-nome">Nome</label>
                <div class="input-group input-group-sm">
                  <span class="input-group-text"><i class="bi bi-search"></i></span>
                  <input type="text" class="form-control" id="filtro-nome" placeholder="Buscar...">
                </div>
              </div>
              <div class="col-sm-2">
                <label class="form-label mb-1" for="filtro-ativo">Status</label>
                <select class="form-select form-select-sm" id="filtro-ativo">
                  <option value="">Todos</option>
                  <option value="true">Ativo</option>
                  <option value="false">Inativo</option>
                </select>
              </div>
              <div class="col-sm-5 d-flex gap-2">
                <button class="btn btn-sm btn-primary flex-fill" id="btn-filtrar">
                  <i class="bi bi-funnel me-1"></i> Filtrar
                </button>
                <button class="btn btn-sm btn-outline-secondary" id="btn-limpar" title="Limpar">
                  <i class="bi bi-x-lg"></i>
                </button>
              </div>
            </div>
          </div>
        </div>

        <!-- Cards das formas de pagamento -->
        <div class="card">
          <div class="card-header d-flex justify-content-between align-items-center">
            <span class="card-title">
              <i class="bi bi-credit-card me-2" style="color:var(--color-structural)"></i>Formas de Pagamento
            </span>
            <button class="btn btn-sm btn-primary" id="btn-nova-forma">
              <i class="bi bi-plus-lg me-1"></i> Nova Forma
            </button>
          </div>
          <div class="card-body p-0">
            <div class="table-responsive">
              <table class="table table-hover mb-0">
                <thead>
                  <tr>
                    <th style="width:50px">#</th>
                    <th>Descrição</th>
                    <th class="text-center">Status</th>
                    <th class="text-center" style="width:90px">Ações</th>
                  </tr>
                </thead>
                <tbody id="tbody-pagamentos">
                  <tr><td colspan="4" class="text-center py-5 text-muted">
                    <div class="spinner-border spinner-border-sm me-2"></div>Carregando...
                  </td></tr>
                </tbody>
              </table>
            </div>
          </div>
          <div class="card-footer d-flex justify-content-between py-2">
            <small class="text-muted" id="info-registros">—</small>
          </div>
        </div>

      </main>
    </div>
  </div>

  <!-- Modal Forma de Pagamento -->
  <div class="modal fade" id="modal-pagamento" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="modal-pagamento-title">Nova Forma de Pagamento</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="form-pagamento" novalidate>
            <input type="hidden" id="pagamento-id">
            <div class="row g-3">

              <!-- Apenas DESCRIÇÃO e STATUS conforme DDL -->
              <div class="col-12">
                <label class="form-label" for="pagamento-descricao">
                  Descrição <span class="text-danger">*</span>
                </label>
                <input type="text" class="form-control" id="pagamento-descricao"
                  required maxlength="120" placeholder="Ex: Cartão Visa Débito, PIX, Dinheiro...">
                <div class="invalid-feedback">Descrição é obrigatória.</div>
              </div>

              <div class="col-md-6">
                <label class="form-label" for="pagamento-ativo">Status</label>
                <select class="form-select" id="pagamento-ativo">
                  <option value="true">Ativo</option>
                  <option value="false">Inativo</option>
                </select>
              </div>

            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-primary" id="btn-salvar-pagamento">
            <i class="bi bi-check-lg me-1"></i> Salvar
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="../../assets/js/bootstrap.bundle.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="../../scripts/utils/SessionManager.js"></script>
  <script src="../../scripts/utils/Toast.js"></script>
  <script src="../../scripts/utils/Mask.js"></script>
  <script src="../../scripts/utils/Router.js"></script>
  <script src="../../scripts/utils/SidebarLoader.js"></script>
  <script src="../../scripts/services/ApiService.js"></script>
  <script src="../../scripts/services/AuthService.js"></script>
  <script src="../../scripts/controllers/DashboardController.js"></script>
  <script src="../../scripts/controllers/PagamentosController.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      Router.protect();
      await SidebarLoader.load();
      new DashboardController().init();
      new PagamentosController().init();
    });
  </script>
</body>
</html>
