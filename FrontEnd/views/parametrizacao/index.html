<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AGAPE — Parametrização</title>
  <link rel="stylesheet" href="../../assets/css/bootstrap.css">
  <link rel="stylesheet" href="../../assets/css/theme.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <style>
    .section-title {
      font-size: var(--font-size-sm);
      font-weight: var(--font-weight-semibold);
      text-transform: uppercase;
      letter-spacing: .5px;
      color: var(--color-structural);
      border-bottom: 2px solid var(--color-structural-light);
      padding-bottom: 6px;
      margin-bottom: 16px;
    }

    .logo-dropzone {
      border: 2px dashed var(--color-border);
      border-radius: var(--radius-lg);
      padding: 24px;
      text-align: center;
      cursor: pointer;
      transition: all var(--transition-fast);
      background: var(--color-background);
    }

    .logo-dropzone:hover,
    .logo-dropzone.dragover {
      border-color: var(--color-primary);
      background: var(--color-primary-light);
    }

    .logo-dropzone img {
      max-height: 80px;
      max-width: 100%;
      object-fit: contain;
    }

    .cep-input-wrap {
      position: relative;
    }

    .cep-spinner {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      display: none;
    }

    .cep-input-wrap.loading .cep-spinner {
      display: block;
    }

    /* #btn-salvar-alteracoes {
      background: var(--color-primary);
    }

    #btn-salvar-alteracoes:hover {
      background: var(--color-primary-dark);
      color: #fff;
    } */
  </style>
</head>

<body>
  <div class="app-layout">
    <div id="sidebar-root"></div>

    <div class="main-content" id="main-content">

      <header class="topbar" role="banner">
        <div class="d-flex align-items-center gap-2">
          <button class="btn btn-link p-0 d-lg-none" id="mobile-menu-toggle" aria-label="Abrir menu"
            aria-expanded="false" aria-controls="sidebar">
            <i class="bi bi-list fs-4" style="color:var(--color-text);"></i>
          </button>
          <div>
            <div class="page-title">Parametrização</div>
            <div class="page-breadcrumb">Início / Configurações / Parametrização</div>
          </div>
        </div>
        <div class="d-flex align-items-center gap-2">

          <div class="me-2">
            <button class="btn btn-sm btn-primary" id="btn-salvar-alteracoes">
              <i class="bi bi-check-lg me-1" style="font-size: 8px;"></i>Salvar
            </button>
          </div>

          <button class="btn btn-sm btn-outline-secondary" id="btn-logout">
            <i class="bi bi-box-arrow-right me-1"></i> Sair
          </button>
        </div>
      </header>

      <main class="page-content" role="main">

        <!-- Loading -->
        <div id="param-loading" class="text-center py-5 text-muted">
          <div class="spinner-border me-2"></div>Carregando configurações...
        </div>

        <!-- Formulário -->
        <form id="form-param" class="d-none" novalidate>

          <div class="row g-4">

            <!-- ── Coluna esquerda ── -->
            <div class="col-lg-8">

              <!-- Dados da Organização -->
              <div class="card mb-4">
                <div class="card-body">
                  <div class="section-title">
                    <i class="bi bi-building me-2"></i>Dados da Organização
                  </div>
                  <div class="row g-3">

                    <div class="col-md-8">
                      <label class="form-label" for="param-razaoSocial">
                        Razão Social / Nome <span class="text-danger">*</span>
                      </label>
                      <input type="text" class="form-control" id="param-razaoSocial" required maxlength="200"
                        placeholder="Ex: Paróquia São Judas Tadeu">
                      <div class="invalid-feedback">Nome é obrigatório.</div>
                    </div>

                    <div class="col-md-4">
                      <label class="form-label" for="param-cnpj">CNPJ</label>
                      <input type="text" class="form-control" id="param-cnpj" placeholder="00.000.000/0000-00"
                        maxlength="18" inputmode="numeric">
                    </div>

                    <div class="col-md-6">
                      <label class="form-label" for="param-nomeFantasia">Nome Fantasia</label>
                      <input type="text" class="form-control" id="param-nomeFantasia" maxlength="120">
                    </div>

                    <div class="col-md-3">
                      <label class="form-label" for="param-inscricaoEstadual">Insc. Estadual</label>
                      <input type="text" class="form-control" id="param-inscricaoEstadual" maxlength="30">
                    </div>

                    <div class="col-md-3">
                      <label class="form-label" for="param-inscricaoMunicipal">Insc. Municipal</label>
                      <input type="text" class="form-control" id="param-inscricaoMunicipal" maxlength="30">
                    </div>

                  </div>
                </div>
              </div>

              <!-- Endereço (ViaCEP) -->
              <div class="card mb-4">
                <div class="card-body">
                  <div class="section-title">
                    <i class="bi bi-geo-alt me-2"></i>Endereço
                  </div>
                  <div class="row g-3">

                    <div class="col-md-3">
                      <label class="form-label" for="param-cep">CEP</label>
                      <div class="cep-input-wrap" id="cep-wrap">
                        <input type="text" class="form-control" id="param-cep" placeholder="00000-000" maxlength="9"
                          inputmode="numeric">
                        <div class="cep-spinner">
                          <div class="spinner-border spinner-border-sm text-muted"></div>
                        </div>
                      </div>
                      <div class="form-text"></div>
                    </div>

                    <div class="col-md-9">
                      <label class="form-label" for="param-logradouro">Logradouro</label>
                      <input type="text" class="form-control" id="param-logradouro" maxlength="200">
                    </div>

                    <div class="col-md-3">
                      <label class="form-label" for="param-numero">Número</label>
                      <input type="text" class="form-control" id="param-numero" maxlength="10">
                    </div>

                    <div class="col-md-4">
                      <label class="form-label" for="param-complemento">Complemento</label>
                      <input type="text" class="form-control" id="param-complemento" maxlength="60">
                    </div>

                    <div class="col-md-5">
                      <label class="form-label" for="param-bairro">Bairro</label>
                      <input type="text" class="form-control" id="param-bairro" maxlength="80">
                    </div>

                    <div class="col-md-6">
                      <label class="form-label" for="param-cidade">Cidade</label>
                      <input type="text" class="form-control" id="param-cidade" maxlength="80">
                    </div>

                    <div class="col-md-2">
                      <label class="form-label" for="param-estado">UF</label>
                      <select class="form-select" id="param-estado">
                        <option value="">—</option>
                        <option value="AC">AC</option>
                        <option value="AL">AL</option>
                        <option value="AM">AM</option>
                        <option value="AP">AP</option>
                        <option value="BA">BA</option>
                        <option value="CE">CE</option>
                        <option value="DF">DF</option>
                        <option value="ES">ES</option>
                        <option value="GO">GO</option>
                        <option value="MA">MA</option>
                        <option value="MG">MG</option>
                        <option value="MS">MS</option>
                        <option value="MT">MT</option>
                        <option value="PA">PA</option>
                        <option value="PB">PB</option>
                        <option value="PE">PE</option>
                        <option value="PI">PI</option>
                        <option value="PR">PR</option>
                        <option value="RJ">RJ</option>
                        <option value="RN">RN</option>
                        <option value="RO">RO</option>
                        <option value="RR">RR</option>
                        <option value="RS">RS</option>
                        <option value="SC">SC</option>
                        <option value="SP" selected>SP</option>
                        <option value="SE">SE</option>
                        <option value="TO">TO</option>
                      </select>
                    </div>

                    <div class="col-md-4">
                      <label class="form-label" for="param-pais">País</label>
                      <input type="text" class="form-control" id="param-pais" value="Brasil" maxlength="50">
                    </div>

                  </div>
                </div>
              </div>

              <!-- Contatos -->
              <div class="card mb-4">
                <div class="card-body">
                  <div class="section-title">
                    <i class="bi bi-telephone me-2"></i>Contatos
                  </div>
                  <div class="row g-3">

                    <div class="col-md-6">
                      <label class="form-label" for="param-telefone1">Telefone Principal</label>
                      <input type="text" class="form-control" id="param-telefone1" placeholder="(00) 0000-0000"
                        maxlength="15" inputmode="tel">
                    </div>

                    <div class="col-md-6">
                      <label class="form-label" for="param-telefone2">Telefone Secundário</label>
                      <input type="text" class="form-control" id="param-telefone2" placeholder="(00) 00000-0000"
                        maxlength="15" inputmode="tel">
                    </div>

                    <div class="col-md-6">
                      <label class="form-label" for="param-email">E-mail Institucional</label>
                      <input type="email" class="form-control" id="param-email" placeholder="contato@paroquia.org.br">
                    </div>

                    <div class="col-md-6">
                      <label class="form-label" for="param-site">Site / Redes Sociais</label>
                      <input type="url" class="form-control" id="param-site" placeholder="https://...">
                    </div>

                    <div class="col-12">
                      <label class="form-label" for="param-responsavel">Responsável Legal</label>
                      <input type="text" class="form-control" id="param-responsavel" maxlength="100">
                    </div>

                  </div>
                </div>
              </div>

              <!-- Configurações do Sistema -->
              <div class="card mb-4">
                <div class="card-body">
                  <div class="section-title">
                    <i class="bi bi-gear me-2"></i>Configurações do Sistema
                  </div>
                  <div class="row g-3">

                    <div class="col-md-6">
                      <label class="form-label" for="param-moeda">Moeda Padrão</label>
                      <input class="form-control" id="param-moeda" value=""/>
                    </div>

                    <div class="col-md-6">
                      <label class="form-label" for="param-fuso">Fuso Horário</label>
                      <input class="form-control" id="param-fuso" value=""/>
                    </div>

                    <div class="col-12">
                      <label class="form-label" for="param-obs">Observações / Slogan</label>
                      <textarea class="form-control" id="param-obs" rows="2" maxlength="300"></textarea>
                    </div>

                  </div>
                </div>
              </div>

            </div>

            <!-- ── Coluna direita: Logos ── -->
            <div class="col-lg-4">
              <div class="card mb-4" style="position:sticky; top:80px;">
                <div class="card-body">
                  <div class="section-title">
                    <i class="bi bi-image me-2"></i>Logotipos
                  </div>


                  <div class="mb-4">
                    <label class="form-label">Logo Grande</label>
                    <div class="logo-dropzone" id="dropzone-logo" ondrop="window.__param_dropLogo(event,'logo')"
                      ondragover="event.preventDefault(); this.classList.add('dragover')"
                      ondragleave="this.classList.remove('dragover')"
                      onclick="document.getElementById('input-logo').click()">
                      <img id="preview-logo" src="" class="d-none mb-2">
                      <i class="bi bi-cloud-upload fs-2 text-muted d-block mb-1" id="icon-logo"></i>
                      <div class="text-muted" style="font-size:13px;" id="label-logo">
                        Arraste ou clique para enviar<br>
                        <small>PNG, JPG — Máx. 2 MB</small>
                      </div>
                      <input type="file" id="input-logo" class="d-none" accept="image/*">
                    </div>
                  </div>

                  <div>
                    <label class="form-label">Logo Pequeno</label>
                    <div class="logo-dropzone" id="dropzone-logo-h" ondrop="window.__param_dropLogo(event,'logoh')"
                      ondragover="event.preventDefault(); this.classList.add('dragover')"
                      ondragleave="this.classList.remove('dragover')"
                      onclick="document.getElementById('input-logoh').click()">
                      <img id="preview-logoh" src="" class="d-none mb-2">
                      <i class="bi bi-cloud-upload fs-2 text-muted d-block mb-1" id="icon-logoh"></i>
                      <div class="text-muted" style="font-size:13px;" id="label-logoh">
                        Arraste ou clique para enviar<br>
                        <small>PNG recomendado — fundo transparente</small>
                      </div>
                      <input type="file" id="input-logoh" class="d-none" accept="image/*">
                    </div>
                  </div>

                  <!-- Confirma Alteração Logo -->
                  <div class="row">
                    <div class="col-12">
                      <div class="text-center">
                        <button type="button" class="btn btn-sm btn-primary mt-3" id="btn-confirm-logo">
                          <i class="bi bi-check-lg me-1"></i>Confirmar
                        </button>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>

        </form>

      </main>
    </div>
  </div>

  <script src="../../assets/js/bootstrap.bundle.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="../../scripts/utils/SessionManager.js"></script>
  <script src="../../scripts/utils/Toast.js"></script>
  <script src="../../scripts/utils/Mask.js"></script>
  <script src="../../scripts/utils/Router.js"></script>
  <script src="../../scripts/utils/SidebarLoader.js"></script>
  <script src="../../scripts/services/ApiService.js"></script>
  <script src="../../scripts/services/AuthService.js"></script>
  <script src="../../scripts/controllers/DashboardController.js"></script>
  <script src="../../scripts/controllers/ParametrizacaoController.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      Router.protect();
      await SidebarLoader.load();
      new DashboardController().init();
      new ParametrizacaoController().init();
    });
  </script>
</body>

</html>
