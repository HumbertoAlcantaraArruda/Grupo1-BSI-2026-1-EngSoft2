<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AGAPE — Portal de Eventos</title>
  <link rel="stylesheet" href="../../assets/css/bootstrap.css">
  <link rel="stylesheet" href="../../assets/css/theme.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css">
  <style>
    .evento-card {
      border-radius: var(--radius-lg);
      border: 1px solid var(--color-border);
      background: var(--color-surface);
      overflow: hidden;
      transition: box-shadow var(--transition-fast), transform var(--transition-fast);
    }
    .evento-card:hover {
      box-shadow: var(--shadow-lg);
      transform: translateY(-2px);
    }
    .evento-card .evento-banner {
      height: 140px;
      background: linear-gradient(135deg, var(--color-structural), #035454);
      display: flex; align-items: center; justify-content: center;
      font-size: 48px; color: rgba(255,255,255,.5);
    }
    .evento-card .evento-banner img {
      width: 100%; height: 100%; object-fit: cover;
    }
    .evento-card .evento-body { padding: 16px; }
    .evento-card .evento-nome {
      font-size: var(--font-size-md);
      font-weight: var(--font-weight-semibold);
      line-height: 1.3;
      margin-bottom: 6px;
    }
    .evento-card .evento-meta {
      font-size: var(--font-size-sm);
      color: var(--color-text-muted);
      line-height: 1.6;
    }
    .evento-card .evento-meta i { width: 16px; }
    .evento-card .evento-footer {
      padding: 12px 16px;
      border-top: 1px solid var(--color-border);
      display: flex; align-items: center; justify-content: space-between;
      gap: 8px;
    }
    .evento-preco {
      font-size: var(--font-size-lg);
      font-weight: var(--font-weight-bold);
      color: var(--color-primary);
    }
    .inscricao-chip {
      font-size: var(--font-size-xs);
      padding: 2px 10px;
      border-radius: var(--radius-pill);
      background: var(--color-success-light);
      color: var(--color-success);
      font-weight: var(--font-weight-medium);
    }
    .inscricao-chip.inscrito {
      background: var(--color-primary-light);
      color: var(--color-primary);
    }
    .capacidade-bar {
      height: 4px;
      border-radius: 2px;
      background: var(--color-border);
      margin-top: 6px;
    }
    .capacidade-bar .fill {
      height: 100%;
      border-radius: 2px;
      background: var(--color-success);
      transition: width .4s;
    }
    .capacidade-bar .fill.quase-lotado { background: var(--color-warning); }
    .capacidade-bar .fill.lotado       { background: var(--color-danger); }
  </style>
</head>

<body>
  <div class="app-layout">
    <div id="sidebar-root"></div>

    <div class="main-content" id="main-content">

      <header class="topbar" role="banner">
        <div class="d-flex align-items-center gap-2">
          <button class="btn btn-link p-0 d-lg-none" id="mobile-menu-toggle"
            aria-label="Abrir menu" aria-expanded="false" aria-controls="sidebar">
            <i class="bi bi-list fs-4" style="color:var(--color-text);"></i>
          </button>
          <div>
            <div class="page-title">Portal de Eventos</div>
            <div class="page-breadcrumb">Início / Eventos / Portal</div>
          </div>
        </div>
        <div class="d-flex align-items-center gap-2">
          <button class="btn btn-sm btn-outline-secondary" id="btn-minhas-inscricoes">
            <i class="bi bi-ticket-perforated me-1"></i>
            Minhas Inscrições
            <span class="badge ms-1" style="background:var(--color-primary)" id="badge-inscricoes">0</span>
          </button>
          <button class="btn btn-sm btn-outline-secondary" id="btn-logout">
            <i class="bi bi-box-arrow-right me-1"></i> Sair
          </button>
        </div>
      </header>

      <main class="page-content" role="main">

        <!-- Filtros -->
        <div class="card mb-4">
          <div class="card-body py-3">
            <div class="row g-2 align-items-end">
              <div class="col-sm-4">
                <label class="form-label mb-1" for="filtro-nome">Buscar Evento</label>
                <div class="input-group input-group-sm">
                  <span class="input-group-text"><i class="bi bi-search"></i></span>
                  <input type="text" class="form-control" id="filtro-nome"
                    placeholder="Nome do evento...">
                </div>
              </div>
              <div class="col-sm-2">
                <label class="form-label mb-1" for="filtro-data">A partir de</label>
                <input type="date" class="form-control form-control-sm" id="filtro-data">
              </div>
              <div class="col-sm-2">
                <label class="form-label mb-1" for="filtro-pago">Pago</label>
                <select class="form-select form-select-sm" id="filtro-pago">
                  <option value="">Todos</option>
                  <option value="nao">Não (Gratuito)</option>
                  <option value="sim">Sim (Pago)</option>
                </select>
              </div>
              <div class="col-sm-4 d-flex gap-2">
                <button class="btn btn-sm btn-primary flex-fill" id="btn-filtrar">
                  <i class="bi bi-funnel me-1"></i> Filtrar
                </button>
                <button class="btn btn-sm btn-outline-secondary" id="btn-limpar" title="Limpar">
                  <i class="bi bi-x-lg"></i>
                </button>
              </div>
            </div>
          </div>
        </div>

        <!-- Grid de Eventos -->
        <div class="row g-3" id="eventos-grid">
          <div class="col-12 text-center py-5 text-muted">
            <div class="spinner-border me-2"></div> Carregando eventos...
          </div>
        </div>

        <!-- Paginação -->
        <div class="d-flex justify-content-center mt-4">
          <nav><ul class="pagination" id="paginacao"></ul></nav>
        </div>

      </main>
    </div>
  </div>

  <!-- Modal: Inscrição -->
  <div class="modal fade" id="modal-inscricao" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header" style="background:var(--color-structural); color:#fff;">
          <h5 class="modal-title" id="modal-inscricao-title">
            <i class="bi bi-ticket-perforated me-2"></i>Inscrever-se
          </h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <!-- Resumo do evento -->
          <div class="rounded p-3 mb-3"
            style="background:var(--color-structural-light); border:1px solid var(--color-structural)">
            <div id="inscricao-evento-nome" class="fw-semibold mb-1"></div>
            <div id="inscricao-evento-data" class="text-muted" style="font-size:13px;"></div>
            <div id="inscricao-evento-valor" class="mt-1 fw-bold" style="color:var(--color-primary)"></div>
          </div>

          <form id="form-inscricao" novalidate>
            <input type="hidden" id="inscricao-evento-id">
            <div class="row g-3">

              <div class="col-12">
                <label class="form-label" for="inscricao-nome">
                  Nome Completo <span class="text-danger">*</span>
                </label>
                <input type="text" class="form-control" id="inscricao-nome"
                  required maxlength="120" placeholder="Seu nome completo">
                <div class="invalid-feedback">Nome é obrigatório.</div>
              </div>

              <div class="col-md-6">
                <label class="form-label" for="inscricao-cpf">CPF</label>
                <input type="text" class="form-control" id="inscricao-cpf"
                  placeholder="000.000.000-00" maxlength="14" inputmode="numeric">
              </div>

              <div class="col-md-6">
                <label class="form-label" for="inscricao-telefone">
                  Telefone <span class="text-danger">*</span>
                </label>
                <input type="text" class="form-control" id="inscricao-telefone"
                  required placeholder="(00) 00000-0000" maxlength="15" inputmode="tel">
                <div class="invalid-feedback">Telefone é obrigatório.</div>
              </div>

              <div class="col-12">
                <label class="form-label" for="inscricao-email">
                  E-mail <span class="text-danger">*</span>
                </label>
                <input type="email" class="form-control" id="inscricao-email"
                  required placeholder="seu@email.com">
                <div class="invalid-feedback">Informe um e-mail válido.</div>
              </div>

              <div class="col-md-6">
                <label class="form-label" for="inscricao-camiseta">
                  Tamanho da Camiseta
                </label>
                <select class="form-select" id="inscricao-camiseta">
                  <option value="">Não informar</option>
                  <option value="PP">PP — Extra Pequeno</option>
                  <option value="P">P — Pequeno</option>
                  <option value="M">M — Médio</option>
                  <option value="G">G — Grande</option>
                  <option value="GG">GG — Extra Grande</option>
                  <option value="XG">XG — Extra Extra Grande</option>
                </select>
              </div>
              <div class="col-12" id="col-obs-inscricao">
                <label class="form-label" for="inscricao-obs">
                  Observações / Restrições alimentares
                </label>
                <textarea class="form-control" id="inscricao-obs" rows="2"
                  maxlength="300" placeholder="Opcional..."></textarea>
              </div>

            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-primary" id="btn-confirmar-inscricao">
            <i class="bi bi-check-circle me-1"></i> Confirmar Inscrição
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal: Minhas Inscrições -->
  <div class="modal fade" id="modal-minhas-inscricoes" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">
            <i class="bi bi-ticket-perforated me-2"></i>Minhas Inscrições
          </h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body p-0">
          <div class="table-responsive">
            <table class="table table-hover mb-0">
              <thead>
                <tr>
                  <th>Evento</th>
                  <th>Data</th>
                  <th class="text-center">Status</th>
                  <th class="text-center">Status Pagamento</th>
                  <th class="text-end">Valor</th>
                  <th class="text-center">Ações</th>
                </tr>
              </thead>
              <tbody id="tbody-minhas-inscricoes">
                <tr><td colspan="6" class="text-center py-4 text-muted">
                  <div class="spinner-border spinner-border-sm me-2"></div> Carregando...
                </td></tr>
              </tbody>
            </table>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal: Inscrição confirmada -->
  <div class="modal fade" id="modal-inscricao-ok" tabindex="-1" aria-hidden="true"
    data-bs-backdrop="static">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-body text-center py-5">
          <i class="bi bi-check-circle-fill" style="font-size:52px; color:var(--color-success);"></i>
          <h4 class="mt-3 fw-bold">Inscrição Confirmada!</h4>
          <p class="text-muted mb-4" id="inscricao-ok-msg"></p>
          <button type="button" class="btn btn-primary" data-bs-dismiss="modal">
            <i class="bi bi-arrow-left me-1"></i> Voltar aos Eventos
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="../../assets/js/bootstrap.bundle.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
  <script src="../../scripts/utils/SessionManager.js"></script>
  <script src="../../scripts/utils/Toast.js"></script>
  <script src="../../scripts/utils/Mask.js"></script>
  <script src="../../scripts/utils/Router.js"></script>
  <script src="../../scripts/utils/SidebarLoader.js"></script>
  <script src="../../scripts/services/ApiService.js"></script>
  <script src="../../scripts/services/AuthService.js"></script>
  <script src="../../scripts/controllers/DashboardController.js"></script>
  <script src="../../scripts/controllers/PortalEventosController.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      Router.protect();
      await SidebarLoader.load();
      new DashboardController().init();
      new PortalEventosController().init();
    });
  </script>
</body>
</html>
