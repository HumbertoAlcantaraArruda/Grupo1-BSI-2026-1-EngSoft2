<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AGAPE — Categorias de Eventos</title>
  <link rel="stylesheet" href="../../assets/css/bootstrap.css">
  <link rel="stylesheet" href="../../assets/css/theme.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>

<body>
  <div class="app-layout">
    <div id="sidebar-root"></div>

    <div class="main-content" id="main-content">

      <header class="topbar" role="banner">
        <div class="d-flex align-items-center gap-2">
          <button class="btn btn-link p-0 d-lg-none" id="mobile-menu-toggle"
            aria-label="Abrir menu" aria-expanded="false" aria-controls="sidebar">
            <i class="bi bi-list fs-4" style="color:var(--color-text);"></i>
          </button>
          <div>
            <div class="page-title">Categorias de Eventos</div>
            <div class="page-breadcrumb">Início / Cadastros / Categorias de Eventos</div>
          </div>
        </div>
        <div class="d-flex align-items-center gap-2">
          <button class="btn btn-sm btn-outline-secondary" id="btn-logout">
            <i class="bi bi-box-arrow-right me-1"></i> Sair
          </button>
        </div>
      </header>

      <main class="page-content" role="main">

        <!-- Filtros -->
        <div class="card mb-3">
          <div class="card-body py-3">
            <div class="row g-2 align-items-end">
              <div class="col-sm-5">
                <label class="form-label mb-1" for="filtro-nome">Nome da Categoria</label>
                <div class="input-group input-group-sm">
                  <span class="input-group-text"><i class="bi bi-search"></i></span>
                  <input type="text" class="form-control" id="filtro-nome" placeholder="Buscar...">
                </div>
              </div>
              <div class="col-sm-4">
                <label class="form-label mb-1" for="filtro-ativo">Status</label>
                <select class="form-select form-select-sm" id="filtro-ativo">
                  <option value="">Todos</option>
                  <option value="true">Ativo</option>
                  <option value="false">Inativo</option>
                </select>
              </div>
              <div class="col-sm-3 d-flex gap-2">
                <button class="btn btn-sm btn-primary flex-fill" id="btn-filtrar">
                  <i class="bi bi-funnel me-1"></i> Filtrar
                </button>
                <button class="btn btn-sm btn-outline-secondary" id="btn-limpar" title="Limpar">
                  <i class="bi bi-x-lg"></i>
                </button>
              </div>
            </div>
          </div>
        </div>

        <!-- Tabela -->
        <div class="card">
          <div class="card-header d-flex justify-content-between align-items-center">
            <span class="card-title">
              <i class="bi bi-calendar2-range me-2" style="color:var(--color-structural)"></i>
              Categorias de Eventos
            </span>
            <button class="btn btn-sm btn-primary" id="btn-nova-cat-evento">
              <i class="bi bi-plus-lg me-1"></i> Nova Categoria
            </button>
          </div>
          <div class="card-body p-0">
            <div class="table-responsive">
              <table class="table table-hover mb-0">
                <thead>
                  <tr>
                    <th>Nome</th>
                    <th class="text-center" style="width:100px">Status</th>
                    <th class="text-center" style="width:110px">Ações</th>
                  </tr>
                </thead>
                <tbody id="tbody-cats-evento">
                  <tr><td colspan="3" class="text-center py-5 text-muted">
                    <div class="spinner-border spinner-border-sm me-2"></div>Carregando...
                  </td></tr>
                </tbody>
              </table>
            </div>
          </div>
          <div class="card-footer d-flex justify-content-between py-2">
            <small class="text-muted" id="info-registros">—</small>
          </div>
        </div>

      </main>
    </div>
  </div>

  <!-- Modal -->
  <div class="modal fade" id="modal-cat-evento" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="modal-cat-evento-title">Nova Categoria de Evento</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="form-cat-evento" novalidate>
            <input type="hidden" id="cat-evento-id">
            <div class="mb-3">
              <label class="form-label" for="cat-evento-nome">
                Nome <span class="text-danger">*</span>
              </label>
              <input type="text" class="form-control" id="cat-evento-nome"
                required maxlength="100" placeholder="Ex: Formação, Litúrgico, Cultural...">
              <div class="invalid-feedback">Nome é obrigatório.</div>
            </div>
            <div class="mb-3">
              <label class="form-label" for="cat-evento-ativo">Status</label>
              <select class="form-select" id="cat-evento-ativo" disabled>
                <option value="true">Ativo</option>
                <option value="false">Inativo</option>
              </select>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-primary" id="btn-salvar-cat-evento">
            <i class="bi bi-check-lg me-1"></i>Salvar
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal Confirmação -->
  <div class="modal fade" id="modal-confirm-delete" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Confirmar Exclusão</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="modal-confirm-delete-body">Confirmar exclusão?</div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-danger" id="modal-confirm-delete-btn">
            <i class="bi bi-trash me-1"></i>Excluir
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="../../assets/js/bootstrap.bundle.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="../../scripts/utils/SessionManager.js"></script>
  <script src="../../scripts/utils/Toast.js"></script>
  <script src="../../scripts/utils/Mask.js"></script>
  <script src="../../scripts/utils/Router.js"></script>
  <script src="../../scripts/utils/SidebarLoader.js"></script>
  <script src="../../scripts/services/ApiService.js"></script>
  <script src="../../scripts/services/AuthService.js"></script>
  <script src="../../scripts/controllers/DashboardController.js"></script>
  <script src="../../scripts/controllers/CategoriaEventosController.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      Router.protect();
      await SidebarLoader.load();
      new DashboardController().init();
      new CategoriaEventosController().init();
    });
  </script>
</body>
</html>
