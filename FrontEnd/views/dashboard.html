<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AGAPE — Dashboard</title>

  <link rel="stylesheet" href="../assets/css/bootstrap.css">
  <link rel="stylesheet" href="../assets/css/theme.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>

<body>
  <div class="app-layout">

    <!-- ══════════════════ SIDEBAR ══════════════════ -->
    <div id="sidebar-root"></div>

    <!-- ══════════════════ CONTEÚDO ══════════════════ -->
    <div class="main-content" id="main-content">

      <!-- Topbar -->
      <header class="topbar" role="banner">
        <div class="d-flex align-items-center gap-2">
          <!-- Botão hambúrguer — visível apenas em mobile -->
          <button class="btn btn-link p-0 d-lg-none" id="mobile-menu-toggle" aria-label="Abrir menu"
            aria-expanded="false" aria-controls="sidebar">
            <i class="bi bi-list fs-4" style="color: var(--color-text);"></i>
          </button>

          <div>
            <div class="page-title" id="page-title">Dashboard</div>
            <div class="page-breadcrumb">Início</div>
          </div>
        </div>

        <div class="d-flex align-items-center gap-2">
          <button class="btn btn-sm btn-outline-secondary" id="btn-logout">
            <i class="bi bi-box-arrow-right me-1"></i> Sair
          </button>
        </div>
      </header>

      <!-- Conteúdo da página -->
      <main class="page-content" role="main" id="page-content">

        <!-- Cards de resumo -->
        <div class="row g-3 mb-4">
          <div class="col-sm-6 col-xl-3">
            <div class="stat-card">
              <div class="stat-icon primary"><i class="bi bi-cart3"></i></div>
              <div>
                <div class="stat-value" id="stat-vendas">—</div>
                <div class="stat-label">Vendas hoje</div>
              </div>
            </div>
          </div>
          <div class="col-sm-6 col-xl-3">
            <div class="stat-card">
              <div class="stat-icon warning"><i class="bi bi-calendar-check"></i></div>
              <div>
                <div class="stat-value" id="stat-eventos">—</div>
                <div class="stat-label">Eventos ativos</div>
              </div>
            </div>
          </div>
          <div class="col-sm-6 col-xl-3">
            <div class="stat-card">
              <div class="stat-icon structural"><i class="bi bi-box-seam"></i></div>
              <div>
                <div class="stat-value" id="stat-produtos">—</div>
                <div class="stat-label">Produtos em estoque</div>
              </div>
            </div>
          </div>
          <div class="col-sm-6 col-xl-3">
            <div class="stat-card">
              <div class="stat-icon success">
                <i class="bi bi-cash"></i>
              </div>
              <div>
                <div class="stat-value" id="stat-caixa">—</div>
                <div class="stat-label">Saldo do caixa</div>
              </div>
            </div>
          </div>
        </div>

        <!-- Placeholder para gráficos / listas futuras -->
        <div class="card">
          <div class="card-header">
            <span class="card-title">Atividade Recente</span>
          </div>
          <div class="card-body text-center py-5 text-muted">
            <i class="bi bi-bar-chart-line fs-1 d-block mb-2"></i>
            Gráficos e resumos serão exibidos aqui.
          </div>
        </div>

      </main>
    </div>
    <!-- /main-content -->

  </div>
  <!-- /app-layout -->

  <!-- Modal de Confirmação de Exclusão (reutilizável) -->
  <div class="modal fade" id="modal-confirm-delete" tabindex="-1" aria-labelledby="modal-confirm-delete-title"
    aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="modal-confirm-delete-title">Confirmar Exclusão</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
        </div>
        <div class="modal-body" id="modal-confirm-delete-body">
          Tem certeza que deseja excluir este registro? Esta ação não pode ser desfeita.
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-danger" id="modal-confirm-delete-btn">Excluir</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="../assets/js/bootstrap.bundle.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>

  <script src="../scripts/utils/SessionManager.js"></script>
  <script src="../scripts/utils/Toast.js"></script>
  <script src="../scripts/utils/Mask.js"></script>
  <script src="../scripts/utils/Router.js"></script>
  <script src="../scripts/utils/SidebarLoader.js"></script>
  <script src="../scripts/utils/PageLoader.js"></script>

  <script src="../scripts/services/ApiService.js"></script>
  <script src="../scripts/services/AuthService.js"></script>
  <script src="../scripts/services/VendasService.js"></script>
  <script src="../scripts/services/CaixaService.js"></script>
  <script src="../scripts/services/facades/CheckoutFacade.js"></script>

  <script src="../scripts/controllers/DashboardController.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      Router.protect();
      await SidebarLoader.load();
      new DashboardController().init();
    });
  </script>

</body>

</html>
