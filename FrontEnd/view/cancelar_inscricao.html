<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agape 2026 - Cancelar Inscrição</title>
    <style>
        :root {
            --bg-color: #1e293b;
            --card-bg: #334155;
            --text-color: #f1f5f9;
            --primary: #ef4444; /* Vermelho para cancelamento */
            --primary-hover: #dc2626;
            --input-bg: #ffffff;
            --input-text: #1e293b;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background-color: var(--card-bg);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
        }

        h1 {
            margin-top: 0;
            font-size: 1.5rem;
            border-bottom: 2px solid var(--primary);
            padding-bottom: 0.5rem;
            margin-bottom: 1.5rem;
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
        }

        input, textarea {
            width: 100%;
            padding: 0.8rem;
            border-radius: 6px;
            border: none;
            background-color: var(--input-bg);
            color: var(--input-text);
            box-sizing: border-box;
            font-size: 1rem;
        }

        textarea {
            height: 100px;
            resize: vertical;
        }

        button {
            width: 100%;
            padding: 1rem;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 1rem;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        #resultado {
            margin-top: 1.5rem;
            padding: 1rem;
            border-radius: 6px;
            display: none;
            font-family: monospace;
            background: #0f172a;
        }

        .success { border-left: 5px solid #22c55e; color: #4ade80; }
        .error { border-left: 5px solid #ef4444; color: #f87171; }
    </style>
</head>
<body>

    <div class="container">
        <h1>❌ Cancelar Inscrição</h1>
        <p style="color: #94a3b8; font-size: 0.9rem; margin-bottom: 1.5rem;">
            O cancelamento promoverá automaticamente o próximo da lista de espera.
        </p>

        <div class="form-group">
            <label for="idInscricao">ID da Inscrição</label>
            <input type="number" id="idInscricao" placeholder="Ex: 7">
        </div>

        <div class="form-group">
            <label for="obs">Motivo do Cancelamento (Obs)</label>
            <textarea id="obs" placeholder="Descreva o motivo..."></textarea>
        </div>

        <button onclick="cancelarInscricao()">Confirmar Cancelamento</button>

        <div id="resultado"></div>
    </div>

    <script>
        async function cancelarInscricao() {
            const id = document.getElementById('idInscricao').value;
            const obs = document.getElementById('obs').value;
            const resDiv = document.getElementById('resultado');

            if (!id) {
                alert("Por favor, informe o ID da inscrição.");
                return;
            }

            resDiv.style.display = 'block';
            resDiv.innerHTML = "Processando...";
            resDiv.className = "";

            try {
                // Usando POST com os parâmetros
                const response = await fetch('http://localhost:8080/cancelarInscricao', {
                    method: 'POST',
                    body: `idInscricao=${id}&obs=${encodeURIComponent(obs)}`
                });

                const data = await response.json();
                
                resDiv.innerHTML = `<strong>Status:</strong> ${data.status}<br>` +
                                   `<strong>Mensagem:</strong> ${data.messages.join(', ')}`;
                
                if (data.status === 'ok') {
                    resDiv.className = "success";
                } else {
                    resDiv.className = "error";
                }

            } catch (err) {
                resDiv.innerHTML = "Erro ao conectar com o servidor. O Main.java está rodando?<br>" + err;
                resDiv.className = "error";
            }
        }
    </script>
</body>
</html>
