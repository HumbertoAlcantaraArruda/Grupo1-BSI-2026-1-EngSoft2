<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agape 2026 - Parametrização da Paróquia</title>
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --agape-blue: #1a237e;
            --agape-gold: #c5a021;
            --agape-white: #f8f9fa;
        }
        body {
            background-color: #f0f2f5;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .navbar {
            background-color: var(--agape-blue) !important;
            border-bottom: 3px solid var(--agape-gold);
        }
        .card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        .card-header {
            background-color: white;
            border-bottom: 2px solid #eee;
            border-radius: 15px 15px 0 0 !important;
            padding: 20px;
        }
        .card-header h2 {
            color: var(--agape-blue);
            font-weight: 700;
            margin: 0;
        }
        .btn-primary {
            background-color: var(--agape-blue);
            border: none;
            padding: 10px 30px;
            font-weight: 600;
        }
        .btn-primary:hover {
            background-color: #0d125a;
        }
        label {
            font-weight: 600;
            color: #555;
            margin-bottom: 5px;
        }
        .form-control:focus {
            border-color: var(--agape-blue);
            box-shadow: 0 0 0 0.25rem rgba(26, 35, 126, 0.25);
        }
    </style>
</head>
<body>

    <!-- Navbar Minimalista -->
    <nav class="navbar navbar-dark mb-5">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="#">
                <img src="https://via.placeholder.com/40x40/c5a021/ffffff?text=A" alt="Logo" width="40" height="40" class="d-inline-block align-text-top me-2 rounded-circle">
                <span class="fs-4 fw-bold">ÁGAPE 2026</span>
            </a>
        </div>
    </nav>

    <div class="container mb-5">
        <div class="row justify-content-center">
            <div class="col-lg-10">
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h2><i class="bi bi-gear-fill me-2"></i>Parametrização da Paróquia</h2>
                        <span class="badge bg-warning text-dark">Módulo do Christiano</span>
                    </div>
                    <div class="card-body p-4">
                        <form id="formParametrizacao">
                            <div class="row g-3">
                                <!-- Dados Principais -->
                                <div class="col-md-4">
                                    <label for="cnpj">CNPJ</label>
                                    <input type="text" class="form-control" id="cnpj" name="cnpj" placeholder="00.000.000/0001-00">
                                </div>
                                <div class="col-md-8">
                                    <label for="razaoSocial">Razão Social</label>
                                    <input type="text" class="form-control" id="razaoSocial" name="razaoSocial">
                                </div>
                                
                                <div class="col-md-12">
                                    <label for="nomeFantasia">Nome Fantasia (Apelido da Paróquia)</label>
                                    <input type="text" class="form-control" id="nomeFantasia" name="nomeFantasia">
                                </div>

                                <!-- Endereço -->
                                <div class="col-md-6">
                                    <label for="endereco">Endereço Completo</label>
                                    <input type="text" class="form-control" id="endereco" name="endereco">
                                </div>
                                <div class="col-md-3">
                                    <label for="email">E-mail de Contato</label>
                                    <input type="email" class="form-control" id="email" name="email">
                                </div>
                                <div class="col-md-3">
                                    <label for="telefone1">Telefone Principal</label>
                                    <input type="text" class="form-control" id="telefone1" name="telefone1">
                                </div>

                                <div class="col-md-12">
                                    <label for="responsavel">Responsável (Pároco/Administrador)</label>
                                    <input type="text" class="form-control" id="responsavel" name="responsavel">
                                </div>

                                <div class="col-12 mt-4 d-flex justify-content-end">
                                    <button type="button" class="btn btn-outline-secondary me-2">Cancelar</button>
                                    <button type="submit" class="btn btn-primary">
                                        Salvar Alterações
                                    </button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts de Integração -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API_URL = 'http://localhost:8080/parametrizacao';

        // 1. Carregar dados ao abrir a página
        window.onload = async () => {
            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                
                if (data.status === 'ok' && data.result) {
                    // Preenche os campos automaticamente
                    Object.keys(data.result).forEach(key => {
                        const input = document.getElementById(key);
                        if (input) input.value = data.result[key];
                    });
                }
            } catch (error) {
                console.error('Erro ao carregar dados:', error);
            }
        };

        // 2. Salvar dados ao submeter o formulário
        document.getElementById('formParametrizacao').onsubmit = async (e) => {
            e.preventDefault();
            
            const formData = new FormData(e.target);
            const params = new URLSearchParams(formData);

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    body: params
                });
                const result = await response.json();

                if (result.status === 'ok') {
                    alert('Parâmetros salvos com sucesso!');
                } else {
                    alert('Erro ao salvar: ' + result.messages.join(', '));
                }
            } catch (error) {
                alert('Erro na conexão com o servidor Backend.');
            }
        };
    </script>
</body>
</html>
