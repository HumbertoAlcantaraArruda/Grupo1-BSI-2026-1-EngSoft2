<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agape 2026 - Parametrização Definitiva</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f1f5f9;
            --primary: #3b82f6;
            --input-bg: #f8fafc;
            --input-text: #0f172a;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
            margin: 0;
        }

        .container {
            background-color: var(--card-bg);
            padding: 2rem;
            border-radius: 12px;
            max-width: 1000px;
            margin: 0 auto;
            border: 1px solid #334155;
        }

        h1 { text-align: center; color: #60a5fa; margin-bottom: 2rem; }

        .section-title {
            font-size: 0.8rem;
            text-transform: uppercase;
            color: #94a3b8;
            margin: 1.5rem 0 0.5rem 0;
            border-bottom: 1px solid #334155;
            padding-bottom: 5px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0.8rem;
        }

        .form-group { display: flex; flex-direction: column; }

        label { font-size: 0.75rem; margin-bottom: 3px; color: #cbd5e1; }

        input, textarea {
            padding: 0.5rem;
            border-radius: 4px;
            border: none;
            background: var(--input-bg);
            color: var(--input-text);
            font-size: 0.9rem;
        }

        .btn-save {
            width: 100%;
            padding: 1rem;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 2rem;
        }

        /* MODAL */
        #modalCompare {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); display: none; justify-content: center; align-items: center;
        }
        .modal-content { background: #1e293b; padding: 2rem; border-radius: 12px; width: 90%; max-width: 600px; }
        .change-item { background: #0f172a; padding: 8px; margin: 4px 0; border-radius: 4px; font-size: 0.85rem; }
        .change-old { color: #f87171; text-decoration: line-through; margin-right: 8px; }
        .change-new { color: #4ade80; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <h1>⚙️ Configurações da Paróquia (Todos os Atributos)</h1>
        
        <form id="formParam">
            <div class="section-title">IDENTIFICAÇÃO</div>
            <div class="grid">
                <div class="form-group"><label>CNPJ</label><input type="text" id="cnpj"></div>
                <div class="form-group" style="grid-column: span 3;"><label>Razão Social</label><input type="text" id="razaoSocial"></div>
                <div class="form-group" style="grid-column: span 2;"><label>Nome Fantasia</label><input type="text" id="nomeFantasia"></div>
                <div class="form-group" style="grid-column: span 2;"><label>Responsável</label><input type="text" id="responsavel"></div>
            </div>

            <div class="section-title">ENDEREÇO COMPLETO</div>
            <div class="grid">
                <div class="form-group" style="grid-column: span 2;"><label>Logradouro</label><input type="text" id="endereco"></div>
                <div class="form-group"><label>Número</label><input type="text" id="numEndereco"></div>
                <div class="form-group"><label>Bairro</label><input type="text" id="bairro"></div>
                <div class="form-group"><label>Complemento</label><input type="text" id="complemento"></div>
                <div class="form-group"><label>Cidade</label><input type="text" id="cidade"></div>
                <div class="form-group"><label>UF</label><input type="text" id="uf"></div>
                <div class="form-group"><label>CEP</label><input type="text" id="cep"></div>
                <div class="form-group"><label>País</label><input type="text" id="pais"></div>
            </div>

            <div class="section-title">CONTATO E CONFIGURAÇÕES</div>
            <div class="grid">
                <div class="form-group" style="grid-column: span 2;"><label>E-mail</label><input type="email" id="email"></div>
                <div class="form-group"><label>Telefone 1</label><input type="text" id="telefone1"></div>
                <div class="form-group"><label>Telefone 2</label><input type="text" id="telefone2"></div>
                <div class="form-group" style="grid-column: span 2;"><label>Site</label><input type="text" id="site"></div>
                <div class="form-group"><label>Moeda</label><input type="text" id="moedaPadrao"></div>
                <div class="form-group"><label>Fuso Horário</label><input type="text" id="fusoHorario"></div>
            </div>

            <div class="section-title">DOCUMENTAÇÃO E LOGOS</div>
            <div class="grid">
                <div class="form-group"><label>Insc. Estadual</label><input type="text" id="inscricaoEstadual"></div>
                <div class="form-group"><label>Insc. Municipal</label><input type="text" id="inscricaoMunicipal"></div>
                <div class="form-group"><label>Logo Pequeno (URL)</label><input type="text" id="logotipoPequeno"></div>
                <div class="form-group"><label>Logo Grande (URL)</label><input type="text" id="logotipoGrande"></div>
            </div>

            <div class="form-group" style="margin-top:1rem;">
                <label>Observações Gerais (OBS)</label>
                <textarea id="obs" style="height: 50px;"></textarea>
            </div>

            <button type="button" class="btn-save" onclick="analisarMudancas()">SALVAR E COMPARAR</button>
        </form>
    </div>

    <div id="modalCompare">
        <div class="modal-content">
            <h2 style="color:#fbbf24">🔍 Revisão de Alterações</h2>
            <div id="listaMudancas" style="max-height: 350px; overflow-y: auto;"></div>
            <div style="display:flex; gap:10px; margin-top:20px">
                <button onclick="confirmarSalvar()" style="flex:1; padding:12px; background:#22c55e; color:white; border:none; border-radius:6px; cursor:pointer; font-weight:bold">CONFIRMAR E GRAVAR</button>
                <button onclick="fecharModal()" style="flex:1; padding:12px; background:#64748b; color:white; border:none; border-radius:6px; cursor:pointer">VOLTAR</button>
            </div>
        </div>
    </div>

    <script>
        let dadosOriginais = {};
        const fields = ['cnpj', 'razaoSocial', 'nomeFantasia', 'responsavel', 'endereco', 'numEndereco', 'bairro', 'complemento', 'cidade', 'uf', 'cep', 'pais', 'email', 'telefone1', 'telefone2', 'site', 'moedaPadrao', 'fusoHorario', 'inscricaoEstadual', 'inscricaoMunicipal', 'logotipoPequeno', 'logotipoGrande', 'obs'];

        window.onload = async () => {
            try {
                const response = await fetch('http://localhost:8080/parametrizacao');
                const data = await response.json();
                if (data.result) {
                    dadosOriginais = data.result;
                    fields.forEach(f => {
                        const input = document.getElementById(f);
                        if (input) input.value = data.result[f] || "";
                    });
                }
            } catch (e) {}
        };

        function analisarMudancas() {
            const mudancas = [];
            fields.forEach(f => {
                const vNovo = document.getElementById(f).value;
                const vAntigo = dadosOriginais[f] || "";
                if (vNovo !== vAntigo) {
                    mudancas.push({ campo: f.toUpperCase(), de: vAntigo || "(Vazio)", para: vNovo || "(Vazio)" });
                }
            });

            if (mudancas.length === 0) { alert("Nenhuma alteração detectada."); return; }

            document.getElementById('listaMudancas').innerHTML = mudancas.map(m => `
                <div class="change-item">
                    <strong>${m.campo}:</strong><br>
                    <span class="change-old">${m.de}</span> ➔ <span class="change-new">${m.para}</span>
                </div>
            `).join('');
            document.getElementById('modalCompare').style.display = 'flex';
        }

        async function confirmarSalvar() {
            fecharModal();
            const params = new URLSearchParams();
            fields.forEach(f => params.append(f, document.getElementById(f).value));

            try {
                const response = await fetch('http://localhost:8080/parametrizacao', { method: 'POST', body: params });
                const data = await response.json();
                alert("✅ Sucesso: " + data.messages.join(', '));
                fields.forEach(f => dadosOriginais[f] = document.getElementById(f).value);
            } catch (err) { alert("❌ Erro: " + err); }
        }

        function fecharModal() { document.getElementById('modalCompare').style.display = 'none'; }
    </script>
</body>
</html>
