<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agape 2026 - Parametrização</title>
    <style>
        :root {
            --bg-color: #1e293b;
            --card-bg: #334155;
            --text-color: #f1f5f9;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --input-bg: #ffffff;
            --input-text: #1e293b;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background-color: var(--card-bg);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 600px;
        }

        h1 {
            margin-top: 0;
            font-size: 1.5rem;
            border-bottom: 2px solid var(--primary);
            padding-bottom: 0.5rem;
            margin-bottom: 1.5rem;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            margin-bottom: 0.4rem;
            font-weight: 600;
            font-size: 0.9rem;
        }

        input {
            width: 100%;
            padding: 0.7rem;
            border-radius: 6px;
            border: none;
            background-color: var(--input-bg);
            color: var(--input-text);
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 1rem;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 1rem;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        #resultado {
            margin-top: 1.5rem;
            padding: 1rem;
            border-radius: 6px;
            display: none;
            font-family: monospace;
            background: #0f172a;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>⚙️ Configurações da Paróquia</h1>
        
        <div class="grid">
            <div class="form-group">
                <label>CNPJ</label>
                <input type="text" id="cnpj" value="12.345.678/0001-90">
            </div>
            <div class="form-group">
                <label>Razão Social</label>
                <input type="text" id="razaoSocial" value="Paróquia Agape 2026">
            </div>
            <div class="form-group">
                <label>Nome Fantasia</label>
                <input type="text" id="nomeFantasia" value="Agape Comunidade">
            </div>
            <div class="form-group">
                <label>Responsável</label>
                <input type="text" id="responsavel" value="Padre João Silva">
            </div>
            <div class="form-group">
                <label>E-mail</label>
                <input type="email" id="email" value="contato@agape2026.com.br">
            </div>
            <div class="form-group">
                <label>Telefone</label>
                <input type="text" id="telefone1" value="(11) 98888-7777">
            </div>
        </div>

        <div class="form-group">
            <label>Endereço Completo</label>
            <input type="text" id="endereco" value="Rua das Flores, 123 - Centro, São Paulo/SP">
        </div>

        <button onclick="salvarConfig()">Salvar Configurações</button>

        <div id="resultado"></div>
    </div>

    <script>
        async function salvarConfig() {
            const resDiv = document.getElementById('resultado');
            resDiv.style.display = 'block';
            resDiv.innerHTML = "Salvando...";

            const params = new URLSearchParams();
            params.append('cnpj', document.getElementById('cnpj').value);
            params.append('razaoSocial', document.getElementById('razaoSocial').value);
            params.append('nomeFantasia', document.getElementById('nomeFantasia').value);
            params.append('responsavel', document.getElementById('responsavel').value);
            params.append('email', document.getElementById('email').value);
            params.append('telefone1', document.getElementById('telefone1').value);
            params.append('endereco', document.getElementById('endereco').value);

            try {
                const response = await fetch('http://localhost:8080/parametrizacao', {
                    method: 'POST',
                    body: params
                });
                const data = await response.json();
                resDiv.innerHTML = "<strong>Sucesso!</strong><br>" + JSON.stringify(data, null, 2);
            } catch (err) {
                resDiv.innerHTML = "Erro ao conectar: " + err;
            }
        }
    </script>
</body>
</html>
