<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="AGAPE — Ambiente de Gestão e Apoio Pastoral Especializado">
  <title>AGAPE — Entrar</title>

  <link rel="stylesheet" href="./assets/css/bootstrap.css">
  <link rel="stylesheet" href="./assets/css/theme.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>

<body>

  <main class="login-page" role="main">
    <div class="login-card" role="region" aria-label="Área de autenticação">

      <!-- Cabeçalho vermelho -->
      <div class="login-header">
        <img src="./assets/img/agape_horizontal.png" alt="Logo AGAPE" class="login-logo">
        <p class="login-subtitle">Ambiente de Gestão e Apoio Pastoral Especializado</p>
      </div>

      <!-- Corpo do formulário -->
      <div class="login-body">

        <!-- Alerta unificado (erro / bloqueio) -->
        <div id="login-alert" class="login-alert" role="alert" aria-live="assertive">
          <i class="bi bi-exclamation-circle-fill flex-shrink-0"></i>
          <span id="login-alert-msg"></span>
        </div>

        <form id="login-form" novalidate autocomplete="off">

          <!-- CPF -->
          <div class="mb-3">
            <label for="cpf" class="form-label">CPF</label>
            <input
              type="text"
              id="cpf"
              name="cpf"
              class="form-control"
              placeholder="000.000.000-00"
              inputmode="numeric"
              maxlength="14"
              autocomplete="username"
              aria-required="true"
              aria-describedby="cpf-error"
            >
            <span id="cpf-error" class="field-error" role="alert"></span>
          </div>

          <!-- Senha -->
          <div class="mb-4">
            <label for="senha" class="form-label">Senha</label>
            <div class="input-password-wrapper">
              <input
                type="password"
                id="senha"
                name="senha"
                class="form-control"
                placeholder="Digite sua senha"
                autocomplete="current-password"
                aria-required="true"
                aria-describedby="senha-error"
              >
              <button
                type="button"
                id="toggle-password"
                class="toggle-password"
                aria-label="Mostrar ou ocultar senha"
                tabindex="-1"
              >
                <i class="bi bi-eye"></i>
              </button>
            </div>
            <span id="senha-error" class="field-error" role="alert"></span>
          </div>

          <!-- Botão de login -->
          <button type="submit" id="btn-login" class="btn-login">
            <i class="bi bi-box-arrow-in-right"></i>
            Entrar
          </button>

        </form>
      </div>
      <!-- /login-body -->

    </div>
  </main>

  <!--
    Ordem de carregamento obrigatória:
    1. Bootstrap  →  2. jQuery  →  3. utils  →  4. services  →  5. controllers
  -->
  <script src="./assets/js/bootstrap.bundle.js"></script>

  <!-- jQuery (baixe em https://jquery.com/download/ e mova para assets/js/) -->
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>

  <!-- Utils -->
  <script src="./scripts/utils/SessionManager.js"></script>
  <script src="./scripts/utils/Toast.js"></script>
  <script src="./scripts/utils/Mask.js"></script>
  <script src="./scripts/utils/Router.js"></script>

  <!-- Services -->
  <script src="./scripts/services/ApiService.js"></script>
  <script src="./scripts/services/AuthService.js"></script>

  <!-- Controller -->
  <script src="./scripts/controllers/AuthController.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => AuthController.getInstance().init());
  </script>

</body>
</html>
